[package]
name = "notch-test-token"
version = "0.1.0"
edition = "2021"
publish = false
description = "Minimal NEP-141 token used only by Notch integration tests"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
borsh = { version = "1", features = ["derive"] }
near-contract-standards = "5.30.1"
near-sdk = "5.30.1"
serde = { version = "1", features = ["derive"] }
