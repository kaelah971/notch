[package]
name = "notch-market"
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
description = "Notch shared market settlement engine (Trend Trading / Trend Battles)"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
borsh = { version = "1", features = ["derive"] }
near-sdk = { version = "5.30.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uint = { version = "0.9", default-features = false }

[dev-dependencies]
near-sdk = { version = "5.30.1", features = ["unit-testing"] }
near-parameters = "0.38"
