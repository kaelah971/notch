    <script>
      // Node globals expected by near-api-js / wallet-selector deps. Classic script: runs before any ES module,
      // including Vite's pre-bundled deps, which evaluate `process.env` at import time.
      window.global = window.global || window;
      window.process = window.process || { env: {}, browser: true, version: '', versions: {}, nextTick: function (f) { var a = [].slice.call(arguments, 1); Promise.resolve().then(function () { f.apply(null, a) }) } };
    </script>
